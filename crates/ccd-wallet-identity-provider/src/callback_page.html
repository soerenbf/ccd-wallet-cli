<!doctype html>
<html>
  <head><meta charset="utf-8"><title>ccd-wallet identity callback</title></head>
  <body>
    <p>Finishing identity issuance...</p>
    <script>
      fetch(window.location.pathname + "/complete", {
        method: "POST",
        headers: {"Content-Type": "text/plain"},
        body: window.location.hash
      }).then(function(response) {
        document.body.textContent = response.ok
          ? "Identity callback received. You can close this tab."
          : "Identity callback failed. Return to ccd-wallet.";
      }).catch(function() {
        document.body.textContent = "Identity callback failed. Return to ccd-wallet.";
      });
    </script>
  </body>
</html>
